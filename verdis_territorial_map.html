<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Verdis GIS Territorial Map</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Map container overrides */
        #map { background: #0f172a; z-index: 10; width: 100%; height: 100%; }
        
        /* Leaflet Dark Theme Adjustments */
        .leaflet-control-zoom { border: none !important; box-shadow: 0 4px 14px rgba(0,0,0,0.5) !important; border-radius: 8px !important; overflow: hidden; }
        .leaflet-control-zoom a { background: #1e293b !important; color: #10b981 !important; border-bottom: 1px solid #334155 !important; transition: all 0.2s ease; }
        .leaflet-control-zoom a:hover { background: #334155 !important; color: #34d399 !important; }
        .leaflet-control-zoom a.leaflet-disabled { background: #0f172a !important; color: #475569 !important; }
        .leaflet-popup-content-wrapper { background: #1e293b; color: #f8fafc; border: 1px solid #334155; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); border-radius: 0.5rem; }
        .leaflet-popup-tip { background: #1e293b; }
        
        /* Custom Marker Animations */
        .beacon-pulse { position: relative; width: 20px; height: 20px; }
        .beacon-pulse::before { content: ''; position: absolute; top: -10px; left: -10px; width: 40px; height: 40px; border-radius: 50%; background: rgba(16, 185, 129, 0.4); animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
        .beacon-pulse::after { content: ''; position: absolute; top: 0; left: 0; width: 20px; height: 20px; background: #10b981; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 0 10px rgba(16, 185, 129, 0.8); }
        @keyframes pulse-ring { 0% { transform: scale(0.3); opacity: 0.9; } 80% { transform: scale(1.6); opacity: 0; } 100% { transform: scale(1.8); opacity: 0; } }
        
        /* Custom Div Icons for Tips */
        .tip-icon { background: #1e293b; border: 2px solid #38bdf8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #38bdf8; box-shadow: 0 4px 6px rgba(0,0,0,0.5); }
    </style>
</head>
<body class="h-dvh flex flex-col bg-slate-950 text-slate-100 overflow-hidden">

    <header class="z-20 bg-slate-900 border-b border-slate-800 shrink-0 shadow-[0_4px_20px_rgba(0,0,0,0.5)] flex flex-col w-full relative">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 p-3 max-h-[50vh] overflow-y-auto items-center">
            
            <!-- Title & Branding -->
            <div class="flex items-center space-x-3 md:col-span-3">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center text-white shadow-lg shadow-emerald-600/20 shrink-0 border border-emerald-400/30">
                    <i class="fa-solid fa-map-location-dot"></i>
                </div>
                <div class="flex flex-col justify-center">
                    <h1 class="text-sm md:text-base font-bold tracking-wide text-white leading-tight">Verdis GIS Portal</h1>
                    <span class="text-[10px] text-emerald-400 font-mono mt-0.5">POCKET 3 CLAIM</span>
                </div>
            </div>

            <!-- Statistics Dashboard -->
            <div class="grid grid-cols-3 gap-2 md:col-span-6">
                <!-- Area -->
                <div class="bg-slate-800/80 border border-slate-700 rounded-lg p-2 flex flex-col justify-center items-center text-center">
                    <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Area</span>
                    <div class="flex items-baseline space-x-1">
                        <span class="text-sm font-bold text-emerald-400 font-mono">0.501</span>
                        <span class="text-[10px] text-emerald-500">km²</span>
                    </div>
                </div>
                <!-- Perimeter -->
                <div class="bg-slate-800/80 border border-slate-700 rounded-lg p-2 flex flex-col justify-center items-center text-center">
                    <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Perimeter</span>
                    <div class="flex items-baseline space-x-1">
                        <span class="text-sm font-bold text-sky-400 font-mono">~4.2</span>
                        <span class="text-[10px] text-sky-500">km</span>
                    </div>
                </div>
                <!-- Status -->
                <div class="bg-slate-800/80 border border-slate-700 rounded-lg p-2 flex flex-col justify-center items-center text-center">
                    <span class="text-[9px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">Status</span>
                    <span class="text-xs font-bold text-amber-400 mt-0.5"><i class="fa-solid fa-circle-exclamation text-[10px] mr-1"></i>Active</span>
                </div>
            </div>

            <!-- Layer Controls & Recenter -->
            <div class="flex items-center justify-between md:justify-end gap-2 md:col-span-3">
                <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-700 w-full md:w-auto">
                    <button class="layer-btn flex-1 flex items-center justify-center gap-1.5 px-3 py-1.5 bg-slate-800 border-emerald-500 text-emerald-400 rounded-md transition-colors text-xs font-medium shadow-sm" data-layer="esriSat">
                        <i class="fa-solid fa-satellite"></i> <span>Sat</span>
                    </button>
                    <button class="layer-btn flex-1 flex items-center justify-center gap-1.5 px-3 py-1.5 border-transparent text-slate-400 rounded-md transition-colors text-xs font-medium" data-layer="esriTopo">
                        <i class="fa-solid fa-mountain-sun"></i> <span>Topo</span>
                    </button>
                </div>
                <button id="btn-recenter" class="w-9 h-9 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white rounded-lg text-sm transition-all flex items-center justify-center shadow-md shadow-emerald-600/30 shrink-0 border border-emerald-400/50" title="Recenter Map">
                    <i class="fa-solid fa-crosshairs"></i>
                </button>
            </div>

        </div>
    </header>

    <main class="flex-1 w-full relative">
        <!-- The Map -->
        <div id="map" class="absolute inset-0"></div>
        
        <!-- Live Cursor Coordinates HUD -->
        <div class="absolute bottom-6 sm:bottom-4 left-1/2 -translate-x-1/2 sm:translate-x-0 sm:left-4 z-[1000] pointer-events-none w-48">
            <div class="bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-lg p-2 shadow-[0_8px_30px_rgb(0,0,0,0.6)]">
                <div class="flex items-center justify-between text-slate-400 text-[9px] uppercase font-bold tracking-wider mb-1.5">
                    <span class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_5px_#34d399]"></span>
                        Telemetry
                    </span>
                    <i class="fa-solid fa-location-crosshairs"></i>
                </div>
                <div class="flex justify-between items-center text-[10px] font-mono border-b border-slate-700 pb-1 mb-1">
                    <span class="text-slate-500 font-sans text-[9px]">LAT</span>
                    <span id="hud-lat" class="text-emerald-300 tracking-wider">--.------</span>
                </div>
                <div class="flex justify-between items-center text-[10px] font-mono">
                    <span class="text-slate-500 font-sans text-[9px]">LNG</span>
                    <span id="hud-lng" class="text-emerald-300 tracking-wider">--.------</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        
        // Accurate coordinates provided for Pocket 3
        const VERDIS_CENTER = [45.594642, 18.907913];
        const ZOOM_LEVEL = 15;

        // Leaflet setup (hide default zoom to place it top-right manually)
        const map = L.map('map', {
            center: VERDIS_CENTER,
            zoom: ZOOM_LEVEL,
            zoomControl: false
        });
        
        // Reposition Zoom Control
        L.control.zoom({ position: 'topright' }).addTo(map);
        L.control.attribution({ position: 'bottomright', prefix: '<a href="https://leafletjs.com" class="text-emerald-400">Leaflet</a>' }).addTo(map);

        // Define Esri Base Layers (Free, no API Key)
        const tileLayers = {
            esriSat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: '&copy; Esri, Maxar, Earthstar Geographics'
            }),
            esriTopo: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: '&copy; Esri, HERE, Garmin, Intermap'
            })
        };

        // Set Default Layer
        let currentLayer = tileLayers.esriSat;
        currentLayer.addTo(map);


        // Exact 0.501 sq km territorial polygon coordinates
        const verdisPolygonCoords = [
          [45.586113, 18.900140], // Southern Apex
         [45.592079, 18.903325],
         [45.595802, 18.906650],
        
  // Western Border Line
  [45.599797, 18.911659],// True Northern Apex (Dashed Line Confluence)
    [45.598249, 18.912862],
  [45.595094, 18.913249], // North-Eastern River Curve
  [45.593062, 18.911462], // Mid-Eastern Riverbank
  [45.591152, 18.907477]  // South-Eastern Shoreline
        ];

        // Render Polygon
        const territoryPolygon = L.polygon(verdisPolygonCoords, {
            color: '#10b981',      // Emerald 500 border
            weight: 3,
            opacity: 0.9,
            fillColor: '#059669',  // Emerald 600 fill
            fillOpacity: 0.35,
            dashArray: '6, 6'      // Dashed border for claimed status
        }).addTo(map);

        territoryPolygon.bindPopup(`
            <div class="p-1 min-w-[140px]">
                <h4 class="font-bold text-emerald-400 mb-1 border-b border-slate-700 pb-1">Pocket 3 (Verdis)</h4>
                <p class="text-xs text-slate-300 mt-1 flex justify-between">Area: <b class="text-white font-mono">0.501 km²</b></p>
                <p class="text-xs text-slate-300 mt-0.5 flex justify-between">Perimeter: <b class="text-white font-mono">~4.2 km</b></p>
            </div>
        `);

        // Markers Array
        const markers = [
            {
                lat: 45.594642, 
                lng: 18.907913, 
                title: "Verdis Center (Claim Area)",
                icon: L.divIcon({ className: 'beacon-pulse', iconSize: [20, 20], iconAnchor: [10, 10] }),
                popupIcon: '<i class="fa-solid fa-flag text-emerald-400"></i>'
            },
            {
                lat: 45.599797,
                lng: 18.911659 , 
                title: "Northern Tip",
                icon: L.divIcon({ className: 'tip-icon', html: '<i class="fa-solid fa-arrow-up"></i>', iconSize: [24, 24], iconAnchor: [12, 12] }),
                popupIcon: '<i class="fa-solid fa-location-dot text-sky-400"></i>'
            },
            {
                lat: 45.586113, 
                lng: 18.900140 ,
                title: "Southern Tip",
                icon: L.divIcon({ className: 'tip-icon', html: '<i class="fa-solid fa-arrow-down"></i>', iconSize: [24, 24], iconAnchor: [12, 12] }),
                popupIcon: '<i class="fa-solid fa-location-dot text-sky-400"></i>'
            }
        ];

        // Plot Markers
        const plottedMarkers = markers.map(m => {
            const marker = L.marker([m.lat, m.lng], { icon: m.icon }).addTo(map);
            marker.bindPopup(`
                <div class="p-1 text-center">
                    <h4 class="font-bold text-white mb-1 flex items-center justify-center gap-1.5">
                        ${m.popupIcon} ${m.title}
                    </h4>
                    <p class="text-[10px] font-mono text-slate-400">${m.lat.toFixed(6)}, ${m.lng.toFixed(6)}</p>
                </div>
            `);
            return marker;
        });


        // Live Telemetry HUD Elements
        const hudLat = document.getElementById('hud-lat');
        const hudLng = document.getElementById('hud-lng');

        function updateHUD(lat, lng) {
            hudLat.textContent = lat.toFixed(6) + '°';
            hudLng.textContent = lng.toFixed(6) + '°';
        }

        // Event: Mouse move (Desktop)
        map.on('mousemove', (e) => {
            updateHUD(e.latlng.lat, e.latlng.lng);
        });

        // Event: Map drag/move (Mobile touch tracking)
        map.on('move', () => {
            const center = map.getCenter();
            updateHUD(center.lat, center.lng);
        });

        // Init HUD
        updateHUD(VERDIS_CENTER[0], VERDIS_CENTER[1]);

        // Recenter Button Logic
        document.getElementById('btn-recenter').addEventListener('click', () => {
            map.flyTo(VERDIS_CENTER, ZOOM_LEVEL, { duration: 1.2 });
            setTimeout(() => {
                plottedMarkers[0].openPopup(); // Open center popup
            }, 1200);
        });

        // Layer Switching Logic
        const layerButtons = document.querySelectorAll('.layer-btn');
        layerButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const target = e.currentTarget;
                const layerKey = target.getAttribute('data-layer');
                
                if (tileLayers[layerKey] && currentLayer !== tileLayers[layerKey]) {
                    
                    // Reset all buttons
                    layerButtons.forEach(b => {
                        b.classList.remove('bg-slate-800', 'border-emerald-500', 'text-emerald-400', 'shadow-sm');
                        b.classList.add('border-transparent', 'text-slate-400');
                    });
                    
                    // Activate clicked button
                    target.classList.remove('border-transparent', 'text-slate-400');
                    target.classList.add('bg-slate-800', 'border-emerald-500', 'text-emerald-400', 'shadow-sm');

                    // Swap Leaflet Layers
                    map.removeLayer(currentLayer);
                    currentLayer = tileLayers[layerKey];
                    currentLayer.addTo(map);
                    
                    // Ensure the vector polygon stays visually on top of the tiles
                    territoryPolygon.bringToFront();
                }
            });
        });
        
        // Handle window resizing ensuring map bounds are respected on rotation/resize
        window.addEventListener('resize', () => {
            map.invalidateSize();
        });
        
        // Initial fitBounds trick for mobile initial loading quirks
        setTimeout(() => {
            map.invalidateSize();
            map.fitBounds(territoryPolygon.getBounds(), { padding: [30, 30] });
        }, 300);

    </script>
</body>
</html>
