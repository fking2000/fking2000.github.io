<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Verdis Territorial Map</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        verdis: {
                            green: '#22c55e',
                            dark: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <style>
        /* Essential resets for mobile map sizing */
        html, body {
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent body scrolling, handle scrolling inside components */
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #e2e8f0;
            z-index: 10;
        }
        
        /* Mobile-friendly Popups */
        .leaflet-popup-content-wrapper {
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .leaflet-popup-content {
            font-family: 'Inter', sans-serif;
            margin: 14px;
            font-size: 0.875rem;
            line-height: 1.4;
        }
        .leaflet-container a.leaflet-popup-close-button {
            color: #94a3b8;
            padding: 10px; /* Larger touch target */
            font-weight: bold;
        }
    </style>
</head>
<body class="flex flex-col bg-slate-50 text-slate-800 antialiased">

    <header class="bg-verdis-dark text-white shadow-md z-20 flex-shrink-0 h-14 md:h-16 relative">
        <div class="h-full w-full mx-auto px-4 sm:px-6 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="https://placehold.co/64x64/22c55e/ffffff?text=V" alt="Verdis Logo" class="h-8 w-8 md:h-10 md:w-10 rounded-full object-cover shadow-sm border-2 border-verdis-green">
                <div>
                    <h1 class="text-base md:text-lg font-bold leading-tight">Territorial Map</h1>
                    <p class="text-[10px] md:text-xs text-emerald-400 font-medium uppercase tracking-wider hidden sm:block">Free Republic of Verdis</p>
                </div>
            </div>
            <div>
                <span class="inline-flex items-center gap-1.5 rounded-full bg-emerald-500/10 px-2.5 py-1 text-[10px] md:text-xs font-medium text-emerald-400 border border-emerald-500/20">
                    <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    Live
                </span>
            </div>
        </div>
    </header>

    <div class="flex flex-col md:flex-row flex-1 overflow-hidden relative z-0">
        
        <!-- Sidebar / Bottom Panel -->
        <!-- On mobile: Bottom 40% height. On desktop: Full height, 320px width -->
        <aside class="w-full h-[40%] md:h-full md:w-80 bg-white shadow-[0_-4px_6px_-1px_rgb(0,0,0,0.1)] md:shadow-xl z-20 overflow-y-auto flex-shrink-0 order-2 md:order-1 flex flex-col">
            <div class="p-4 md:p-5 space-y-5">
                
                <!-- Territory Info -->
                <div>
                    <h2 class="text-base md:text-lg font-bold text-slate-900">Pocket 3 (Verdis)</h2>
                    <p class="text-xs md:text-sm text-slate-500 mt-0.5">Geographic and administrative data.</p>
                </div>

                <div class="grid grid-cols-2 gap-2 md:gap-3">
                    <div class="bg-slate-50 rounded-lg p-2 md:p-3 border border-slate-200">
                        <span class="block text-[9px] md:text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Status</span>
                        <span class="inline-flex items-center text-[11px] md:text-xs font-semibold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded border border-amber-200">
                            Disputed
                        </span>
                    </div>
                    <div class="bg-slate-50 rounded-lg p-2 md:p-3 border border-slate-200">
                        <span class="block text-[9px] md:text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Total Area</span>
                        <span class="text-[11px] md:text-xs font-semibold text-slate-700">~0.26 km²</span>
                    </div>
                </div>

                <hr class="border-slate-100">

                <!-- Legend -->
                <div>
                    <h3 class="text-xs md:text-sm font-bold text-slate-900 mb-2 md:mb-3">Map Legend</h3>
                    <ul class="space-y-2.5">
                        <li class="flex items-center gap-3">
                            <div class="w-4 h-4 md:w-5 md:h-5 rounded bg-green-500/30 border-2 border-green-500 flex-shrink-0"></div>
                            <span class="text-xs font-medium text-slate-600">Claimed Boundary</span>
                        </li>
                        <li class="flex items-center gap-3">
                            <div class="w-4 h-4 md:w-5 md:h-5 flex items-center justify-center flex-shrink-0">
                                <svg class="w-5 h-5 text-blue-500 drop-shadow-sm" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                            </div>
                            <span class="text-xs font-medium text-slate-600">Points of Interest</span>
                        </li>
                    </ul>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <!-- On mobile: Top 60% height. On desktop: Remaining width -->
        <main class="w-full flex-1 order-1 md:order-2 relative bg-slate-200">
            <div id="map"></div>
            
            <!-- Floating Mobile-Friendly Coordinate Tracker -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-[400] pointer-events-none w-11/12 max-w-[280px]">
                <div class="bg-slate-900/80 backdrop-blur-md border border-white/10 rounded-xl p-2.5 shadow-2xl flex items-center gap-3 pointer-events-auto">
                    <div class="bg-emerald-500/20 p-1.5 rounded-lg flex-shrink-0">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <span id="coord-label" class="text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Cursor Position</span>
                        <span id="live-coords" class="text-emerald-400 font-mono text-xs font-bold truncate">Acquiring...</span>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Initialize Map
            const map = L.map('map', {
                zoomControl: false, // Custom position later
                tap: true           // Ensure touch events work properly
            }).setView([45.562, 18.922], 15);

            L.control.zoom({ position: 'topright' }).addTo(map);

            // 2. Setup Esri Free Tile Layers (No API Keys)
            const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: '&copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
            });

            const esriStreet = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                attribution: '&copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN'
            });

            // Default layer
            esriSatellite.addTo(map);

            // 3. Layer Control
            const baseMaps = {
                "Satellite View": esriSatellite,
                "Street View": esriStreet
            };
            L.control.layers(baseMaps, null, { position: 'topleft' }).addTo(map);

            // 4. Territorial Polygon
            const verdisCoords = [
                [45.565, 18.915],
                [45.568, 18.925],
                [45.558, 18.930],
                [45.555, 18.918]
            ];

            const territoryPolygon = L.polygon(verdisCoords, {
                color: '#22c55e',
                weight: 3,
                fillColor: '#22c55e',
                fillOpacity: 0.35,
                dashArray: '5, 5'
            }).addTo(map);

            territoryPolygon.bindPopup(`
                <div class="text-center pb-1">
                    <strong class="text-slate-900 block mb-0.5 text-sm">Free Republic of Verdis</strong>
                    <span class="text-slate-500 block text-[10px] uppercase font-semibold">Territorial Claim</span>
                </div>
            `);

            // 5. Points of Interest
            const addMarker = (lat, lng, title, description) => {
                const marker = L.marker([lat, lng]).addTo(map);
                marker.bindPopup(`
                    <div class="min-w-[140px]">
                        <strong class="text-slate-900 block mb-1 text-sm">${title}</strong>
                        <span class="text-slate-500 text-xs">${description}</span>
                    </div>
                `);
                return marker;
            };

            addMarker(45.562, 18.922, "Claimed Center", "The designated administrative center.");
            addMarker(45.565, 18.926, "Danube Anchorage", "Primary water access point.");
            addMarker(45.557, 18.921, "Weather Station", "Site for meteorological sensors.");

            // 6. Mobile-Friendly Coordinate Tracker Logic
            const liveCoordsEl = document.getElementById('live-coords');
            const coordLabelEl = document.getElementById('coord-label');
            let isTouchDevice = false;

            // Detect touch to switch tracking mode
            map.on('touchstart', () => {
                isTouchDevice = true;
                coordLabelEl.innerText = "Map Center";
            });

            // Update UI Helper
            const updateTracker = (lat, lng) => {
                liveCoordsEl.innerText = `${lat.toFixed(5)}° N, ${lng.toFixed(5)}° E`;
            };

            // Desktop: Track Mouse
            map.on('mousemove', (e) => {
                if (!isTouchDevice) {
                    coordLabelEl.innerText = "Cursor Position";
                    updateTracker(e.latlng.lat, e.latlng.lng);
                }
            });

            // Mobile/Touch: Track Map Center on drag
            map.on('move', () => {
                if (isTouchDevice) {
                    const center = map.getCenter();
                    updateTracker(center.lat, center.lng);
                }
            });

            // Set initial state based on center
            const initialCenter = map.getCenter();
            updateTracker(initialCenter.lat, initialCenter.lng);

            // 7. Ensure Layout stabilization
            setTimeout(() => {
                map.invalidateSize();
                map.fitBounds(territoryPolygon.getBounds(), { padding: [20, 20] });
            }, 300);

            // Recalculate Leaflet size when rotating device
            window.addEventListener('resize', () => {
                map.invalidateSize();
            });
        });
    </script>
</body>
</html>
